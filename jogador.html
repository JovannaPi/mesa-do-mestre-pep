<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Mesa — Visão da Jogadora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { padding-bottom: 20px; }
  .player-header {
    text-align: center;
    padding: 18px 16px 10px;
  }
  .player-header h1 { margin: 0; color: var(--accent); font-size: 1.6rem; }
  .player-status { font-size: 0.85rem; color: var(--text-dim); margin-top: 4px; }
  .player-main { max-width: 900px; margin: 0 auto; padding: 0 16px 40px; }
  .handout-box {
    margin-bottom: 18px;
    text-align: center;
  }
  .handout-box img {
    max-width: 100%;
    max-height: 70vh;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 3px solid var(--accent-strong);
  }
  .handout-caption { margin-top: 8px; font-family: "Fredoka", sans-serif; color: var(--accent-deep); font-size: 1.1rem; }
  #player-map-canvas { height: auto; min-height: 300px; max-height: 75vh; }
  .shared-text-box {
    margin-bottom: 18px;
    background: var(--parchment);
    color: var(--parchment-text);
    border: 3px solid var(--royal-gold);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow);
  }
  .shared-text-box h2 { margin: 0 0 10px; font-family: "Fredoka", sans-serif; color: var(--parchment-text); }
  .shared-text-box p { white-space: pre-wrap; margin: 0; line-height: 1.5; }

  .inventories-section { margin-top: 26px; }
  .inventories-section > summary {
    cursor: pointer; font-family: "Fredoka", sans-serif; font-size: 1.15rem;
    color: var(--accent-deep); padding: 10px 4px; list-style: none;
  }
  .inventories-section > summary::-webkit-details-marker { display: none; }
  .inventories-section > summary::before { content: "▶ "; font-size: 0.8em; }
  .inventories-section[open] > summary::before { content: "▼ "; }
  .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .inventory-card {
    background: var(--bg-card); border: 2px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px;
  }
  .inventory-card h3 { margin: 0 0 8px; font-size: 1.02rem; color: var(--accent-deep); }
  .inventory-card ul { margin: 0; padding-left: 18px; }
  .inventory-card li { margin-bottom: 3px; }
  .inventory-card .field-hint { margin: 0; }
</style>
</head>
<body>
<div class="page-vignette"></div>

<div class="player-header">
  <h1 id="player-campaign-name">Mesa do Mestre</h1>
  <p class="player-status" id="player-status">Conectando...</p>
</div>

<main class="player-main">
  <div id="handout-box" class="handout-box" style="display:none;">
    <img id="handout-img" alt="Imagem da Mestra">
    <p class="handout-caption" id="handout-caption"></p>
  </div>

  <div id="shared-text-box" class="shared-text-box" style="display:none;">
    <h2 id="shared-text-title"></h2>
    <p id="shared-text-body"></p>
  </div>

  <p class="field-hint" style="text-align:center;">Arraste os marcadores para mover seu personagem.</p>
  <div id="player-map-canvas" class="map-canvas">
    <div class="empty-state"><span class="icon empty-state-icon">map</span><span>Aguardando a Mestra escolher um mapa...</span></div>
  </div>

  <details class="inventories-section" open>
    <summary>Inventários das Princesas</summary>
    <div id="inventory-list" class="inventory-grid"></div>
  </details>
</main>

<script src="jogador.js"></script>
</body>
</html>
